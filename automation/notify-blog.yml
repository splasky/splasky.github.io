# Install at .github/workflows/notify-blog.yml in your content repository.
name: Update public blog

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'content/thoughts.json'
      - 'content/about.md'
      - 'assets/**'
      - '.github/workflows/notify-blog.yml'
  workflow_dispatch:

permissions: {}

# Change this one value to the GitHub repository that hosts the public reader.
env:
  SITE_REPOSITORY: your-account/your-blog-pages-repository

concurrency:
  group: notify-public-blog
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request public site rebuild
        env:
          GH_TOKEN: ${{ secrets.BLOG_PUBLISH_TOKEN }}
          CONTENT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set BLOG_PUBLISH_TOKEN with Contents: write on SITE_REPOSITORY only.'
            exit 1
          fi
          jq -n --arg sha "$CONTENT_SHA" \
            '{event_type:"blog-content-updated",client_payload:{source_sha:$sha}}' \
            | gh api --method POST "repos/$SITE_REPOSITORY/dispatches" --input -
